---
layout: default
---
<article class="post">
  <header>
    <p class="meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time>
    </p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="lede">{{ page.description }}</p>{% endif %}
  </header>
  <div class="body">
{{ content }}
  </div>
  <nav class="pager">
    {% if page.previous %}<a class="prev" href="{{ page.previous.url | relative_url }}"><small>←</small>{{ page.previous.title }}</a>{% else %}<span></span>{% endif %}
    {% if page.next %}<a class="next" href="{{ page.next.url | relative_url }}"><small>→</small>{{ page.next.title }}</a>{% endif %}
  </nav>
</article>
