<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8a8a"/></marker></defs>
<rect x="20" y="20" width="210" height="70" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="125.0" y="43.0" text-anchor="middle" fill="#8a8a8a" font-weight="600">Every minute</text>
<text x="125.0" y="59.0" text-anchor="middle" fill="#8a8a8a" font-size="11.5">read the queue and</text>
<text x="125.0" y="75.0" text-anchor="middle" fill="#8a8a8a" font-size="11.5">what our slots cost</text>
<rect x="270" y="20" width="190" height="70" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="365.0" y="43.0" text-anchor="middle" fill="#8a8a8a" font-weight="600">Slots needed</text>
<text x="365.0" y="59.0" text-anchor="middle" fill="#8a8a8a" font-size="11.5">to clear the backlog</text>
<text x="365.0" y="75.0" text-anchor="middle" fill="#8a8a8a" font-size="11.5">in about 5 minutes</text>
<rect x="500" y="20" width="200" height="70" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="600.0" y="43.0" text-anchor="middle" fill="#8a8a8a" font-weight="600">Rent one machine</text>
<text x="600.0" y="59.0" text-anchor="middle" fill="#8a8a8a" font-size="11.5">if over 200 games wait:</text>
<text x="600.0" y="75.0" text-anchor="middle" fill="#8a8a8a" font-size="11.5">cheapest per slot, bid +15%</text>
<path d="M230 55 L270 55" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M460 55 L500 55" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="500" y="140" width="200" height="70" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="600.0" y="163.0" text-anchor="middle" fill="#8a8a8a" font-weight="600">Worker container</text>
<text x="600.0" y="179.0" text-anchor="middle" fill="#8a8a8a" font-size="11.5">joins Tailscale with</text>
<text x="600.0" y="195.0" text-anchor="middle" fill="#8a8a8a" font-size="11.5">its own token</text>
<path d="M600 90 L600 140" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="270" y="140" width="190" height="70" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="365.0" y="163.0" text-anchor="middle" fill="#8a8a8a" font-weight="600">Lease games</text>
<text x="365.0" y="179.0" text-anchor="middle" fill="#8a8a8a" font-size="11.5">play with the judge,</text>
<text x="365.0" y="195.0" text-anchor="middle" fill="#8a8a8a" font-size="11.5">send results, replays</text>
<path d="M500 175 L460 175" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="20" y="140" width="210" height="70" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="125.0" y="163.0" text-anchor="middle" fill="#8a8a8a" font-weight="600">Return the machine</text>
<text x="125.0" y="179.0" text-anchor="middle" fill="#8a8a8a" font-size="11.5">idle 10 min, outbid,</text>
<text x="125.0" y="195.0" text-anchor="middle" fill="#8a8a8a" font-size="11.5">or not needed</text>
<path d="M270 175 L230 175" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="20" y="250" width="680" height="50" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="360.0" y="279.0" text-anchor="middle" fill="#8a8a8a" font-weight="600">Caps: $1 an hour, $10 a day, 6 machines, 4 rentals an hour; a flaky host is skipped for 2 hours</text>
</svg>
