<text x="115.0" y="154.0" text-anchor="middle" fill="#8a8a8a" font-weight="600">Collection workers</text>
<text x="115.0" y="170.0" text-anchor="middle" fill="#8a8a8a" font-size="11.5">2 per GPU, hundreds of</text>
<text x="115.0" y="186.0" text-anchor="middle" fill="#8a8a8a" font-size="11.5">matches each, C++ engine</text>
<rect x="300" y="130" width="160" height="72" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
