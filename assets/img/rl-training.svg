<text x="380.0" y="170.0" text-anchor="middle" fill="#8a8a8a" font-size="11.5">one batched GPU call</text>
<text x="380.0" y="186.0" text-anchor="middle" fill="#8a8a8a" font-size="11.5">per step for every match</text>
<path d="M210 155 L300 155" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="255" y="148" text-anchor="middle" fill="#8a8a8a" font-size="11.5">observations</text>
