<rect x="490" y="260" width="210" height="60" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="595.0" y="286.0" text-anchor="middle" fill="#8a8a8a" font-weight="600">Rebuild threads</text>
<text x="595.0" y="302.0" text-anchor="middle" fill="#8a8a8a" font-size="11.5">replay matches into observations</text>
<path d="M645 202 L645 260" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#a)"/>
