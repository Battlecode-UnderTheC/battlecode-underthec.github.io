<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8a8a"/></marker></defs>
<rect x="20" y="20" width="200" height="58" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="120.0" y="45.0" text-anchor="middle" fill="#8a8a8a" font-weight="600">JAX (build time only)</text>
<text x="120.0" y="61.0" text-anchor="middle" fill="#8a8a8a" font-size="11.5">exports act and gradient programs</text>
<rect x="260" y="20" width="440" height="58" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="480.0" y="45.0" text-anchor="middle" fill="#8a8a8a" font-weight="600">dragons_train: one C++ process on 4 RTX 2080 Ti</text>
<text x="480.0" y="61.0" text-anchor="middle" fill="#8a8a8a" font-size="11.5">runs the exported programs through PJRT</text>
