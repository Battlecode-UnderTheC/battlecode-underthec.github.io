<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8a8a"/></marker></defs>
<rect x="20" y="130" width="110" height="56" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="75.0" y="162.0" text-anchor="middle" fill="#8a8a8a" font-weight="600">h (192)</text>
<rect x="170" y="130" width="120" height="56" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="230.0" y="154.0" text-anchor="middle" fill="#8a8a8a" font-weight="600">Kind</text>
<text x="230.0" y="170.0" text-anchor="middle" fill="#8a8a8a" font-size="11.5">MOVE or SPLIT</text>
<path d="M130 158 L170 158" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="340" y="20" width="200" height="60" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="440.0" y="46.0" text-anchor="middle" fill="#8a8a8a" font-weight="600">Split size</text>
<text x="440.0" y="62.0" text-anchor="middle" fill="#8a8a8a" font-size="11.5">score each n = 2 … L−2</text>
<rect x="340" y="130" width="200" height="60" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="440.0" y="148.0" text-anchor="middle" fill="#8a8a8a" font-weight="600">Move token</text>
<text x="440.0" y="164.0" text-anchor="middle" fill="#8a8a8a" font-size="11.5">GRU(64); score N, E, S, W, STOP</text>
<text x="440.0" y="180.0" text-anchor="middle" fill="#8a8a8a" font-size="11.5">from the tile states there</text>
<rect x="340" y="240" width="200" height="60" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="440.0" y="266.0" text-anchor="middle" fill="#8a8a8a" font-weight="600">Walk the remembered map</text>
<text x="440.0" y="282.0" text-anchor="middle" fill="#8a8a8a" font-size="11.5">next position, portals included</text>
<path d="M290 150 L340 50" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="306" y="96" text-anchor="end" fill="#8a8a8a" font-size="11.5">SPLIT</text>
<path d="M290 160 L340 160" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="315" y="153" text-anchor="middle" fill="#8a8a8a" font-size="11.5">MOVE</text>
<path d="M440 190 L440 240" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="448" y="220" text-anchor="start" fill="#8a8a8a" font-size="11.5">a direction</text>
<path d="M340 270 L320 270 L320 175 L340 175" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="316" y="228" text-anchor="end" fill="#8a8a8a" font-size="11.5">up to 8</text>
<rect x="580" y="70" width="120" height="60" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="640.0" y="88.0" text-anchor="middle" fill="#8a8a8a" font-weight="600">Sonar</text>
<text x="640.0" y="104.0" text-anchor="middle" fill="#8a8a8a" font-size="11.5">4 directions,</text>
<text x="640.0" y="120.0" text-anchor="middle" fill="#8a8a8a" font-size="11.5">257 choices each</text>
<rect x="580" y="200" width="120" height="56" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="640.0" y="224.0" text-anchor="middle" fill="#8a8a8a" font-weight="600">Command</text>
<text x="640.0" y="240.0" text-anchor="middle" fill="#8a8a8a" font-size="11.5">and its log-prob</text>
<path d="M540 50 L640 50 L640 70" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M540 150 L580 110" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="566" y="150" text-anchor="start" fill="#8a8a8a" font-size="11.5">STOP</text>
<path d="M640 130 L640 200" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
